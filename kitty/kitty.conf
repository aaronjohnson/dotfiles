# kitty settings. Colours live in *-theme.auto.conf (Solarized, follows light/dark).

# ---- Font size, the usual Japanese-keyboard way (no Shift) ----
#   Ctrl + ;   bigger   (the key with + on it)
#   Ctrl + -   smaller
#   Ctrl + 0   normal size
# kitty catches these before Emacs sees them. In emacs -nw that costs C-0 and C-- as
# prefix arguments; M-0 … M-9 and M-- do the same job.
map ctrl+semicolon change_font_size all +1.0
map ctrl+minus     change_font_size all -1.0
map ctrl+0         change_font_size all 0

# Turn off kitty's US-keyboard defaults for the same thing.
map ctrl+shift+equal
map ctrl+shift+plus
map ctrl+shift+minus
map ctrl+shift+backspace
map ctrl+shift+kp_add
map ctrl+shift+kp_subtract

# Links: a click (or Ctrl+Shift+E hints) opens through open-url, a new browser tab,
# browser focused; nothing to close afterwards.
open_url_with ~/dotfiles/bin/open-url
