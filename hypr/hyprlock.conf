# hyprlock: the lock screen, in Solarized Dark (easy on the eyes at any hour).
# Needs programs.hyprlock.enable = true in NixOS so it has a PAM entry to check
# your password.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# A blurred, darkened snapshot of whatever was on screen.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    color = rgb(002b36)                 # used if the screenshot isn't available
}

label {
    monitor =
    text = $TIME
    color = rgb(eee8d5)
    font_size = 72
    font_family = monospace
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = rgb(93a1a1)
    font_size = 18
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(2aa198)
    inner_color = rgb(002b36)
    font_color = rgb(93a1a1)
    check_color = rgb(b58900)           # while checking the password
    fail_color = rgb(dc322f)
    fade_on_empty = false
    placeholder_text = <span foreground="##586e75">password</span>
    position = 0, -60
    halign = center
    valign = center
}
