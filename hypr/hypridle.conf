# hypridle: what happens when you stop using the laptop.
# Runs as a systemd user service (services.hypridle via programs.hyprlock in NixOS).
# Video players and browsers playing video hold an "idle inhibitor", so none of
# this fires while you're watching something.
#
# Screen on/off uses the Lua-config dispatcher. Always pass action = "on"/"off":
# anything else means "toggle".

general {
    lock_cmd = pidof hyprlock || hyprlock                       # one lock screen, never two
    before_sleep_cmd = loginctl lock-session                    # lock before the lid-close sleep
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 2.5 min: dim the screen (remembering the brightness so it can come back).
listener {
    timeout = 150
    on-timeout = brightnessctl -s -c backlight set 10%
    on-resume = brightnessctl -r -c backlight
}

# 5 min: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r -c backlight
}

# 15 min: sleep (then hibernate after 2h), unless a Nix build is running (its
# processes run as nixbld users, e.g. the CI runner's builds) while on the charger.
# On battery it always sleeps, so a forgotten build can't drain it.
listener {
    timeout = 900
    on-timeout = if [ "$(cat /sys/class/power_supply/ACAD/online)" = 1 ] && ps -eo user= | grep -q "^nixbld"; then exit 0; fi; systemctl suspend-then-hibernate
}
